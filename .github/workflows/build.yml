name: build

# macOS because that is what the README tells you to install, and a public
# repo gets Actions minutes for free. If this ever moves to Linux the brew
# line has to be replaced rather than translated: m68k-elf-gcc is not in apt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  roms:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: brew install cc65 rgbds arm-none-eabi-gcc m68k-elf-gcc

      - name: Show what is installed
        run: make toolchains

      - name: Build
        run: make

      # A ROM that assembles but comes out the wrong size is the failure this
      # catches: an 83 MB "GBA cartridge" from a bad linker script looks like a
      # successful build until someone tries to load it.
      - name: Check ROM sizes
        run: |
          set -euo pipefail
          fail=0
          for f in dist/gba/*.gba; do
            size=$(stat -f%z "$f")
            if [ "$size" -lt 512 ] || [ "$size" -gt 65536 ]; then
              echo "::error::$f is $size bytes, expected 512..65536"; fail=1
            else
              echo "ok $f ($size bytes)"
            fi
          done
          for f in dist/gb/*.gb; do
            size=$(stat -f%z "$f")
            if [ "$size" -ne 32768 ]; then
              echo "::error::$f is $size bytes, expected 32768"; fail=1
            else
              echo "ok $f ($size bytes)"
            fi
          done
          for f in dist/md/*.bin; do
            size=$(stat -f%z "$f")
            # A cartridge is a ROM chip: the size must be a power of two, or
            # Genesis Plus GX segfaults on load.
            if [ $(( size & (size - 1) )) -ne 0 ] || [ "$size" -lt 32768 ]; then
              echo "::error::$f is $size bytes, expected a power of two >= 32768"; fail=1
            else
              echo "ok $f ($size bytes)"
            fi
          done
          for f in dist/nes/*.nes; do
            size=$(stat -f%z "$f")
            if [ "$size" -ne 40976 ]; then
              echo "::error::$f is $size bytes, expected 40976 (NROM-256)"; fail=1
            else
              echo "ok $f ($size bytes)"
            fi
          done
          exit $fail

      - name: Check GBA header
        run: |
          set -euo pipefail
          for f in dist/gba/*.gba; do
            # 0xB2 must be 0x96 or it is not a cartridge image at all.
            byte=$(dd if="$f" bs=1 skip=178 count=1 2>/dev/null | xxd -p)
            [ "$byte" = "96" ] || { echo "::error::$f byte 0xB2 is $byte, expected 96"; exit 1; }
            echo "ok $f header"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: roms
          path: dist/
