# C64 .prg. The character set has to sit at a fixed address the VIC can see,
# so it gets its own memory area rather than being placed by the linker:
# MAIN and CHARSET are filled so that CHARSET lands exactly at $2000 in the
# file, which is where the VIC is pointed. MAPS is not filled, so the file
# ends where the data does.
#
# VIC bank 0. Screen at $0400, charset $2000, sprites $2800, colour RAM is
# always $D800 whatever the bank.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP:       file = "",  start = $0002, size = $00FE, type = rw, define = yes;
    LOADADDR: file = %O,  start = $07FF, size = $0002;
    MAIN:     file = %O,  start = $0801, size = $17FF, fill = yes, define = yes;
    CHARSET:  file = %O,  start = $2000, size = $0800, fill = yes;
    SPRITES:  file = %O,  start = $2800, size = $0200, fill = yes;
    MAPS:     file = %O,  start = $2A00, size = $8000, define = yes;
    BSS:      file = "",  start = $C000, size = $0F00, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    CHARS:    load = CHARSET,  type = ro;
    SPRDATA:  load = SPRITES,  type = ro;
    MAPDATA:  load = MAPS,     type = ro;
    ZEROPAGE: load = ZP,       type = zp;
    BSS:      load = BSS,      type = bss;
}
